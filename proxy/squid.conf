# Hardened Squid Egress Proxy for Antigravity Agent Sandbox (Option B: General Web + Strict Blocklist)
http_port 3128

# Do not expose internal client IP or Squid version
via off
forwarded_for delete
httpd_suppress_version_string on

# Access Control Lists (ACLs)
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Strictly block all private LAN, loopback, link-local, and Docker host subnets
acl private_networks dst 10.0.0.0/8
acl private_networks dst 172.16.0.0/12
acl private_networks dst 192.168.0.0/16
acl private_networks dst 127.0.0.0/8
acl private_networks dst 169.254.0.0/16
acl private_networks dst fc00::/7
acl private_networks dst fe80::/10
acl private_networks dst ::1

# Block host.docker.internal and explicitly blocklisted domains (e.g. MS/Copilot telemetry)
acl docker_host dstdomain host.docker.internal gateway.docker.internal kubernetes.docker.internal
acl blocked_domains dstdomain "/etc/squid/blocked_domains.txt"

# Block Git smart HTTP push endpoints
acl git_push_path urlpath_regex -i /git-receive-pack$

# --- Enforcement Order ---

# Deny non-safe ports and non-443 CONNECT requests
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Block Docker host aliases, blocklisted domains, and RFC-1918 / loopback destinations
http_access deny docker_host
http_access deny blocked_domains
http_access deny private_networks

# Block Git receive-pack (HTTP pushes)
http_access deny git_push_path

# Allow general public HTTP (80) and HTTPS (443) internet access
http_access allow all

# Disable disk caching inside container
cache deny all
access_log stdio:/var/log/squid/access.log
